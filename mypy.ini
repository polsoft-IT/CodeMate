[mypy]
# Ustawienia ogólne
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
follow_imports = normal
strict_optional = True

# Zignoruj niektóre moduły
[mypy-tkinter.*]
ignore_missing_imports = True

[mypy-src.term.terminal]
ignore_missing_imports = True

# Wyłącz sprawdzanie dla dużego pliku głównego (monolit — typowanie docelowo
# do wydzielenia do src/; patrz plan refaktoryzacji).
[mypy-baza_skryptow]
follow_imports = skip
follow_imports_for_stubs = False
ignore_errors = True
ignore_missing_imports = True

# Terminal — moduł interaktywny, do otypowania osobnym etapem
[mypy-src.term.terminal]
ignore_errors = True

# Włącz strict mode dla nowych modułów
[mypy-src.git_integration]
strict = True

[mypy-src.plugin_system]
strict = True

[mypy-src.starter_snippets]
strict = True
